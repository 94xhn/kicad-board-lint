[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "kicad-board-lint"
version = "0.1.0"
description = "Find board problems KiCad's DRC silently accepts: pads with no net, duplicate-pad net mismatches, and power tracks too thin for their current"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
authors = [{ name = "94xhn" }]
keywords = ["kicad", "pcb", "lint", "drc", "eda", "ci", "hardware", "ipc-2221"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Manufacturing",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Electronic Design Automation (EDA)",
    "Topic :: Software Development :: Quality Assurance",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7", "ruff>=0.4"]

[project.scripts]
kicad-board-lint = "kicad_board_lint.cli:main"

[project.urls]
Homepage = "https://github.com/94xhn/kicad-board-lint"
Issues = "https://github.com/94xhn/kicad-board-lint/issues"
Changelog = "https://github.com/94xhn/kicad-board-lint/blob/main/CHANGELOG.md"

[tool.hatch.build.targets.wheel]
packages = ["kicad_board_lint"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]
